name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Job 1 — Backend NestJS
  # ============================================
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    env:
      # Base jetable des tests de bout en bout. Le nom DOIT finir par "_test" :
      # la suite vide les tables entre chaque scénario et refuse de tourner sur
      # une base qui ne porte pas ce suffixe (backend/test/setup-e2e.ts).
      TEST_DATABASE_URL: postgresql://mawid:mawid_ci_password@localhost:5432/mawid_test?schema=public

    services:
      # Les tests E2E ont besoin d'un VRAI PostgreSQL : la protection contre la
      # double réservation est une contrainte d'exclusion qui vit en base, et
      # aucun double ne peut la simuler. C'est aussi le seul endroit où l'on
      # vérifie que `btree_gist` et `unaccent` s'installent bien.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mawid
          # Mot de passe d'un conteneur jetable, joignable seulement depuis ce
          # runner : ce n'est pas un secret (docs/SECURITY.md §5).
          POSTGRES_PASSWORD: mawid_ci_password
          POSTGRES_DB: mawid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mawid -d mawid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Génère le client Prisma TypeScript — sinon ESLint et tsc ne connaissent
      # pas les types prisma.user, prisma.salon, etc.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # URL factice : prisma generate n'a pas besoin de se connecter à la DB,
          # mais l'adapter Pg vérifie la présence de DATABASE_URL au chargement.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Tests unitaires : PrismaService est remplacé par un double dans chaque
      # suite, ils tournent donc sans base et échouent vite. Lancés avant les
      # E2E pour que l'erreur la plus simple ressorte en premier.
      - name: Test
        run: npm run test

      # Applique le schéma réel, extensions comprises. Si une migration ne
      # passe plus, la CI le dit ici plutôt qu'en production.
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # Tests de bout en bout contre l'application complète et la vraie base :
      # isolation entre salons, contrainte anti-double-réservation, quotas,
      # rate limiting. Voir backend/test/README.md.
      - name: Test (e2e)
        run: npm run test:e2e

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mawid-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================
  # Job 2 — Frontend Next.js
  # ============================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: mawid-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend