name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Job 1 — Backend NestJS
  # ============================================
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Génère le client Prisma TypeScript — sinon ESLint et tsc ne connaissent
      # pas les types prisma.user, prisma.salon, etc.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # URL factice : prisma generate n'a pas besoin de se connecter à la DB,
          # mais l'adapter Pg vérifie la présence de DATABASE_URL au chargement.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Tests unitaires : ils n'ont besoin d'aucune base, PrismaService est
      # remplacé par un double dans chaque suite. On garde donc la CI
      # découplée de Postgres (cf. docs/DATABASE.md §4).
      - name: Test
        run: npm run test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mawid-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================
  # Job 2 — Frontend Next.js
  # ============================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: mawid-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend